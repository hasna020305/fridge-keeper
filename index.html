<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fridge Keeper - 유통기한 관리</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>🥬 Fridge Keeper</h1>
      <p>식품의 유통기한을 확인하고 냉장고를 관리해 보세요.</p>
    </header>

    <section>
      <h2>식품 등록</h2>

      <form id="food-form">
        <div>
          <label for="food-name">식품 이름</label>
          <input
            type="text"
            id="food-name"
            placeholder="예: 우유"
            maxlength="50"
            required
          >
        </div>

        <div>
          <label for="expiry-date">유통기한</label>
          <input type="date" id="expiry-date" required>
        </div>

        <div>
          <label for="quantity">수량</label>
          <input
            type="number"
            id="quantity"
            min="1"
            step="1"
            value="1"
            required
          >
        </div>

        <div>
          <label for="storage">보관 장소</label>
          <select id="storage">
            <option value="냉장">냉장</option>
            <option value="냉동">냉동</option>
            <option value="실온">실온</option>
          </select>
        </div>

        <button type="submit" disabled>식품 추가</button>
      </form>
      <p>등록 기능은 다음 개발 단계에서 연결합니다.</p>
    </section>

    <section>
      <h2>식품 목록</h2>

      <table>
        <thead>
          <tr>
            <th scope="col">식품 이름</th>
            <th scope="col">유통기한</th>
            <th scope="col">수량</th>
            <th scope="col">보관 장소</th>
            <th scope="col">남은 날짜</th>
            <th scope="col">관리</th>
          </tr>
        </thead>
        <tbody id="food-list">
          <tr>
            <td colspan="6">등록된 식품이 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
