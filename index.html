<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fridge Keeper - 유통기한 관리</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>🥬 Fridge Keeper</h1>
      <p>식품의 유통기한을 확인하고 냉장고를 관리해 보세요.</p>
    </header>

    <section>
      <h2>식품 등록</h2>

      <form id="food-form">
        <div>
          <label for="food-name">식품 이름</label>
          <input
            type="text"
            id="food-name"
            placeholder="예: 우유"
            maxlength="50"
            required
          >
        </div>

        <div>
          <label for="expiry-date">유통기한</label>
          <input type="date" id="expiry-date" required>
        </div>

        <div>
          <label for="quantity">수량</label>
          <input
            type="number"
            id="quantity"
            min="1"
            step="1"
            value="1"
            required
          >
        </div>

        <div>
          <label for="storage">보관 장소</label>
          <select id="storage">
            <option value="냉장">냉장</option>
            <option value="냉동">냉동</option>
            <option value="실온">실온</option>
          </select>
        </div>

        <button type="submit">식품 추가</button>
      </form>
      <p>식품 정보를 입력하고 추가 버튼을 눌러 주세요.</p>
    </section>

    <section>
      <h2>식품 목록</h2>
      <div class="search-box">
        <label for="search-input">🔍 식품 검색</label>
        <input
          type="search"
          id="search-input"
          placeholder="찾을 식품 이름을 입력해 주세요"
  >
</div>

<div class="sort-box">
  <label for="sort-select">🌱 목록 정렬</label>
  <select id="sort-select">
    <option value="registered">등록순</option>
    <option value="expiry">유통기한이 가까운 순</option>
    <option value="name">식품 이름순</option>
  </select>
</div>

      <table>
        <thead>
          <tr>
            <th scope="col">식품 이름</th>
            <th scope="col">유통기한</th>
            <th scope="col">수량</th>
            <th scope="col">보관 장소</th>
            <th scope="col">남은 날짜</th>
            <th scope="col">관리</th>
          </tr>
        </thead>
        <tbody id="food-list">
          <tr>
            <td colspan="6">등록된 식품이 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
